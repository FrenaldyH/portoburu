<!doctype html>
<!--
  Link preview image: the source of public/og.png (1200 x 630), the picture shown when the site's
  link is shared on LinkedIn, WhatsApp, Discord, and similar apps. It mirrors the left column of
  the site: name, tagline, a short education and location line, and the contact pills, on the
  same dusty black. Text sizes are larger than on the site because apps show this image at about
  480px wide, where anything under 20px becomes unreadable.

  The text is typed here by hand, not read from src/data/profile.ts, so this file needs no build
  step. Regenerate the image after changing the name, tagline, education, or socials:
    1. Edit the text below to match profile.ts.
    2. Open this file in Chrome, press F12, then Ctrl+Shift+M to show the device toolbar.
    3. Set the size to 1200 x 630, zoom to 100%, and DPR to 1 if that field is shown.
    4. In the device toolbar's ⋮ menu, choose "Capture screenshot" and save it as public/og.png.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=block"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        background: #000000;
        color: #ededed;
        font-family: "Geist", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background: url("../src/assets/dust/near.svg") 0 0 / 389px 389px;
        opacity: 0.55;
      }

      main {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 100%;
        padding: 80px;
        background: radial-gradient(700px circle at 240px 170px, rgb(255 255 255 / 0.06), transparent 70%);
      }

      h1 {
        font-size: 64px;
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: -0.025em;
      }

      .tagline {
        margin-top: 24px;
        max-width: 880px;
        font-size: 30px;
        line-height: 1.3;
        color: #a1a1a1;
      }

      .meta {
        margin-top: 28px;
        font-family: "Geist Mono", monospace;
        font-size: 22px;
        line-height: 1.6;
        color: #6b6b6b;
      }

      ul {
        display: flex;
        gap: 12px;
        list-style: none;
        font-family: "Geist Mono", monospace;
        font-size: 20px;
      }

      li {
        padding: 8px 18px;
        border: 1px solid #1f1f1f;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Frenaldy Bestabba Hasugian</h1>
        <p class="tagline">Informatics student at ITS building backend systems, grounded in competitive programming.</p>
        <p class="meta">Informatics, ITS · Surabaya, Indonesia</p>
      </div>
      <ul>
        <li>GitHub</li>
        <li>LinkedIn</li>
        <li>Codeforces</li>
        <li>YouTube</li>
      </ul>
    </main>
  </body>
</html>
